<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موسوعة الصحيحين - البخاري ومسلم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .hadith-font { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 py-4 px-6">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-amber-400">موسوعة الصحيحين</h1>
        <p class="text-xs text-slate-400 mt-0.5">البحث الفوري في صحيح الإمام البخاري وصحيح الإمام مسلم</p>
      </div>

      <div class="flex items-center gap-2">
        <select id="bookFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
          <option value="all">كلا الصحيحين</option>
          <option value="bukhari">صحيح البخاري فقط</option>
          <option value="muslim">صحيح مسلم فقط</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">
    <div class="relative mb-6">
      <input type="text" id="searchInput" 
             placeholder="ابحث عن كلمة، راوٍ، أو جزء من حديث (مثال: إنما الأعمال بالنيات)..." 
             class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-5 py-4 text-base focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-100 placeholder-slate-500 shadow-lg">
      <span id="resultCount" class="absolute left-4 top-4 text-xs bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-full">جاهز للبحث</span>
    </div>

    <div id="loader" class="text-center py-16">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-400 border-t-transparent mb-3"></div>
      <p class="text-slate-400 text-sm">جاري تحميل بيانات الأحاديث وفهرستها...</p>
    </div>

    <div id="resultsContainer" class="space-y-4"></div>

    <div id="pagination" class="flex justify-center items-center gap-3 mt-8 hidden">
      <button id="prevBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm border border-slate-700">السابق</button>
      <span id="pageInfo" class="text-sm text-slate-400"></span>
      <button id="nextBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm border border-slate-700">التالي</button>
    </div>
  </main>

  <script>
    let allHadiths = [];
    let filteredHadiths = [];
    let currentPage = 1;
    const itemsPerPage = 15;

    function normalizeArabic(text) {
      if (!text) return "";
      return text
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/[إأآا]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه")
        .trim();
    }

    async function loadHadithData() {
      try {
        const [bukhariRes, muslimRes] = await Promise.all([
          fetch("./data/ara-bukhari.min.json"),
          fetch("./data/ara-muslim.min.json")
        ]);

        const bukhariData = await bukhariRes.json();
        const muslimData = await muslimRes.json();

        const bukhariFormatted = bukhariData.hadiths.map(h => ({
          book: "صحيح البخاري",
          id: "bukhari",
          number: h.hadithnumber,
          text: h.text,
          normalized: normalizeArabic(h.text)
        }));

        const muslimFormatted = muslimData.hadiths.map(h => ({
          book: "صحيح مسلم",
          id: "muslim",
          number: h.hadithnumber,
          text: h.text,
          normalized: normalizeArabic(h.text)
        }));

        allHadiths = [...bukhariFormatted, ...muslimFormatted];
        document.getElementById("loader").classList.add("hidden");
        document.getElementById("resultCount").innerText = `إجمالي: ${allHadiths.length} حديث`;
        filteredHadiths = allHadiths;
        renderResults();
      } catch (err) {
        document.getElementById("loader").innerHTML = `<p class="text-red-400">تعذر تحميل ملفات الأحاديث من مجلد data.</p>`;
      }
    }

    function applyFilter() {
      const query = normalizeArabic(document.getElementById("searchInput").value);
      const selectedBook = document.getElementById("bookFilter").value;

      filteredHadiths = allHadiths.filter(item => {
        const matchesBook = selectedBook === "all" || item.id === selectedBook;
        const matchesQuery = query === "" || item.normalized.includes(query);
        return matchesBook && matchesQuery;
      });

      currentPage = 1;
      document.getElementById("resultCount").innerText = `${filteredHadiths.length} نتيجة`;
      renderResults();
    }

    function renderResults() {
      const container = document.getElementById("resultsContainer");
      const pagination = document.getElementById("pagination");
      container.innerHTML = "";

      if (filteredHadiths.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500">لا توجد نتائج مطابقة لبحثك.</div>`;
        pagination.classList.add("hidden");
        return;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const paginatedItems = filteredHadiths.slice(start, start + itemsPerPage);

      paginatedItems.forEach(h => {
        const card = document.createElement("div");
        card.className = "p-5 bg-slate-800/60 border border-slate-700/60 rounded-xl hover:border-slate-600 transition";
        card.innerHTML = `
          <div class="flex items-center justify-between mb-3 border-b border-slate-700/50 pb-2">
            <span class="text-xs font-bold px-2 py-1 rounded ${h.id === 'bukhari' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}">${h.book}</span>
            <span class="text-xs text-slate-400">رقم الحديث: ${h.number}</span>
          </div>
          <p class="hadith-font text-xl leading-relaxed text-slate-200">${h.text}</p>
        `;
        container.appendChild(card);
      });

      const totalPages = Math.ceil(filteredHadiths.length / itemsPerPage);
      pagination.classList.toggle("hidden", totalPages <= 1);
      document.getElementById("pageInfo").innerText = `صفحة ${currentPage} من ${totalPages}`;
      document.getElementById("prevBtn").disabled = currentPage === 1;
      document.getElementById("nextBtn").disabled = currentPage === totalPages;
    }

    document.getElementById("searchInput").addEventListener("input", applyFilter);
    document.getElementById("bookFilter").addEventListener("change", applyFilter);
    
    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentPage > 1) { currentPage--; renderResults(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      const totalPages = Math.ceil(filteredHadiths.length / itemsPerPage);
      if (currentPage < totalPages) { currentPage++; renderResults(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });

    loadHadithData();
  </script>
</body>
</html>
